# Identificacion del proyecto
sonar.projectKey=devsecops-calidad-grupo-11_DevSecOps-Grupo-11
sonar.organization=devsecops-calidad-grupo-11

# Codigo fuente y pruebas
sonar.sources=app
sonar.tests=tests,tests-unit

# Exclusiones
sonar.exclusions=**/node_modules/**,**/playwright-report/**,**/test-results/**
sonar.test.exclusions=**/node_modules/**,**/playwright-report/**,**/test-results/**

# Reporte de cobertura
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality Gate
sonar.qualitygate.wait=true